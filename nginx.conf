server {
    listen 8080;
    server_name guillemin.dev;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx replaces inherited add_header directives as soon
    # as a child block declares its own, so this set is re-asserted in every
    # location below that adds its own headers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://contact.guillemin.dev; frame-src 'self'; form-action 'self' https://contact.guillemin.dev; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets hashés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://contact.guillemin.dev; frame-src 'self'; form-action 'self' https://contact.guillemin.dev; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    }

    # Vite emits the pdf.js worker as `.mjs`, an extension absent from nginx's
    # mime.types. Served as application/octet-stream it is rejected as a module
    # worker under X-Content-Type-Options: nosniff, and the CV fails to render.
    # No add_header here on purpose: the server-level security headers are then
    # inherited instead of having to be re-declared.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
    }

    # Cache pour les fichiers statiques. Le CV est désormais rendu par pdf.js
    # (fetch same-origin + canvas), plus aucune iframe : SAMEORIGIN reste posé
    # par prudence mais n'est plus requis pour /cv.pdf.
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://contact.guillemin.dev; frame-src 'self'; form-action 'self' https://contact.guillemin.dev; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
